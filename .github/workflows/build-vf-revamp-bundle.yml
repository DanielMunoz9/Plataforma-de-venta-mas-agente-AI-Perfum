name: Build VF Revamp bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug workspace
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          pwd
          ls -la

      - name: Zip vf-revamp-pages (rooted for WP upload)
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/vf-revamp-pages.zip"
          SRC="wp-content/plugins/vf-revamp-pages"
          if [ -d "$SRC" ]; then
            echo "Zipping $SRC -> $OUT"
            zip -r "$OUT" "$SRC" -x "$SRC/**/.*"
            echo "Zip created:"
            ls -la "$OUT" || true
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Directory $SRC not found"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload vf-revamp-pages
        if: steps.pages.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vf-revamp-pages
          path: vf-revamp-pages.zip
          if-no-files-found: error

      - name: Zip vf-revamp-customizer (rooted for WP upload)
        id: customizer
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/vf-revamp-customizer.zip"
          SRC="wp-content/plugins/vf-revamp-customizer"
          if [ -d "$SRC" ]; then
            echo "Zipping $SRC -> $OUT"
            zip -r "$OUT" "$SRC" -x "$SRC/**/.*"
            ls -la "$OUT" || true
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Directory $SRC not found"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload vf-revamp-customizer
        if: steps.customizer.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vf-revamp-customizer
          path: vf-revamp-customizer.zip
          if-no-files-found: error

      - name: Zip vf-extras (rooted for WP upload)
        id: extras
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/vf-extras.zip"
          SRC="wp-content/plugins/vf-extras"
          if [ -d "$SRC" ]; then
            echo "Zipping $SRC -> $OUT"
            zip -r "$OUT" "$SRC" -x "$SRC/**/.*"
            ls -la "$OUT" || true
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Directory $SRC not found"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload vf-extras
        if: steps.extras.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vf-extras
          path: vf-extras.zip
          if-no-files-found: error

      - name: Done
        run: echo "Finished build"
