services:
  - type: web
    name: amelie-ai-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k gthread -b 0.0.0.0:$PORT test_amelie:app
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://lightslategrey-gorilla-972270.hostingersite.com
      - key: AMELIE_NAME
        value: Amélie
      - key: AMELIE_GREETING
        value: ¡Hola! Soy Amélie, tu asistente de ventas. ¿En qué puedo ayudarte hoy?
      - key: AMELIE_SECRET
        generateValue: true